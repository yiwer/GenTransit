<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GenTransit</title>
    <script>
      // 首帧前按记住的主题加 .dark，避免闪白

        if (localStorage.getItem('gt-theme') === 'dark') document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
